apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-api
resources: [../../base]
images:
  - name: hello-api
    newName: ghcr.io/ericparra1984-blip/hello-api
    newTag: sha-b4a20fa
patches:
  - target: {kind: Service, name: hello-api}
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
